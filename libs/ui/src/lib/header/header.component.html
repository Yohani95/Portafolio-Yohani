<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-deep-900/90 backdrop-blur-md shadow-sm transition-colors duration-200"
>
  <nav class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <a routerLink="/" class="text-2xl font-bold bg-gradient-marine bg-clip-text text-transparent">
        Yohani Espinoza
      </a>

      <!-- Desktop Navigation -->
      <ul class="hidden md:flex items-center space-x-6">
        <li>
          <a
            routerLink="/"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Inicio
          </a>
        </li>
        <li>
          <a
            routerLink="/projects"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            class="text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Proyectos
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            class="text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Acerca de
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            class="text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Contacto
          </a>
        </li>
        <li>
          <!-- Dark Mode Toggle -->
          <button
            (click)="toggleTheme()"
            class="p-2 rounded-lg text-deep-700 dark:text-deep-200 hover:bg-deep-100 dark:hover:bg-deep-800 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-marine-500"
            [attr.aria-label]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          >
            <!-- Sun icon (show in dark mode) -->
            <svg
              *ngIf="isDark"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>
            <!-- Moon icon (show in light mode) -->
            <svg
              *ngIf="!isDark"
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
          </button>
        </li>
      </ul>

      <!-- Mobile actions -->
      <div class="md:hidden flex items-center gap-2">
        <!-- Dark Mode Toggle Mobile -->
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-lg text-deep-700 dark:text-deep-200 hover:bg-deep-100 dark:hover:bg-deep-800 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-marine-500"
          [attr.aria-label]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        >
          <svg *ngIf="isDark" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <svg
            *ngIf="!isDark"
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </button>

        <!-- Menu Toggle -->
        <button
          (click)="toggleMenu()"
          class="p-2 text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 focus:outline-none focus:ring-2 focus:ring-marine-500 rounded-lg"
          [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
          [attr.aria-expanded]="menuOpen"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            *ngIf="!menuOpen"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            *ngIf="menuOpen"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="menuOpen" class="md:hidden mt-4 py-4 border-t border-deep-200 dark:border-deep-700">
      <ul class="flex flex-col space-y-4">
        <li>
          <a
            routerLink="/"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            class="block text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Inicio
          </a>
        </li>
        <li>
          <a
            routerLink="/projects"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            (click)="closeMenu()"
            class="block text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Proyectos
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            (click)="closeMenu()"
            class="block text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Acerca de
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="text-marine-600 dark:text-marine-400 font-semibold"
            (click)="closeMenu()"
            class="block text-deep-700 dark:text-deep-200 hover:text-marine-600 dark:hover:text-marine-400 transition-colors duration-200"
          >
            Contacto
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>
